name: Build and publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build ${{ matrix.name }}
    if: github.repository == 'binarygeek119/media_ai_model_server'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cuda
            file: ./Dockerfile
            latest: true
            extra_tag: cuda
          - name: intel
            file: ./Dockerfile-intel
            latest: false
            extra_tag: intel
          - name: amd
            file: ./Dockerfile-amd
            latest: false
            extra_tag: amd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Read version
        id: version
        run: |
          version=$(awk '/^VERSION:/{print $2}' config/version.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=${{ matrix.latest }}
          tags: |
            type=raw,value=${{ matrix.extra_tag }}
            type=raw,value=${{ steps.version.outputs.version }}-${{ matrix.extra_tag }}
            type=sha,prefix=${{ matrix.extra_tag }}-
          labels: |
            org.opencontainers.image.title=media_ai_model_server (${{ matrix.name }})
            org.opencontainers.image.description=AI tagging server ${{ matrix.name }} image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }},ignore-error=true
